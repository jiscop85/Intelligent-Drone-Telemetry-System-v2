version: '3.8'

services:
  # MQTT Message Broker
  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: drone-mqtt
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - mosquitto_data:/mosquitto/data
      - mosquitto_logs:/mosquitto/log
      - ./config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    networks:
      - drone-network
    healthcheck:
      test: ["CMD", "mosquitto_pub", "-h", "localhost", "-t", "test", "-m", "test"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
# InfluxDB (Optional - Phase 1)
  influxdb:
    image: influxdb:latest
    container_name: drone-influxdb
    environment:
      INFLUXDB_ADMIN_USER: admin
      INFLUXDB_ADMIN_PASSWORD: password123
      INFLUXDB_DB: drone-telemetry
    ports:
      - "8086:8086"
    volumes:
      - influxdb_data:/var/lib/influxdb
    networks:
      - drone-network
    restart: unless-stopped
    profiles:
      - optional

  # Grafana (Optional - Phase 1, for visualization)
  grafana:
    image: grafana/grafana:latest
    container_name: drone-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - drone-network
    depends_on:
      - influxdb
    restart: unless-stopped
    profiles:
      - optional

  # SQLite (Embedded, no service needed but document for reference)
  # Database file: ./data/flights.db

  # Development PostgreSQL (Optional - future production database)
  postgres:
    image: postgres:15-alpine
    container_name: drone-postgres
    environment:
      POSTGRES_DB: drone_telemetry
      POSTGRES_USER: drone
      POSTGRES_PASSWORD: drone_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - drone-network
    restart: unless-stopped
    profiles:
      - optional

networks:
  drone-network:
    driver: bridge

volumes:
  mosquitto_data:
    driver: local
  mosquitto_logs:
    driver: local
  influxdb_data:
    driver: local
  grafana_data:
    driver: local
  postgres_data:
    driver: local

  
