# Mosquitto MQTT Broker Configuration
# For Drone Telemetry System
# Place in: /etc/mosquitto/mosquitto.conf

# ============================================================================
# Default listener (port 1883)
# ============================================================================
listener 1883
protocol mqtt

# Allow connections from all interfaces
# Use "bind_address 127.0.0.1" to restrict to localhost only
# bind_address 0.0.0.0

# Maximum number of client connections
max_connections -1

# Maximum number of queued messages for offline clients
max_queued_messages 1000

# ============================================================================
# WebSocket listener (port 9001) - for future browser dashboards
# ============================================================================
listener 9001
protocol websockets

# ============================================================================
# Persistence
# ============================================================================
# Enable persistence to save messages between restarts
persistence true

# Path to persistence database
persistence_location /var/lib/mosquitto/

# Persistence format (default: v4)
persistence_format v4

# Save retained messages on shutdown
retain_available true

# ============================================================================
# Logging
# ============================================================================
# Set verbosity level
# log_type debug
log_type all

# Log destinations
# Uncomment to see all messages
# log_dest stdout

# Log to system log
# log_dest syslog

# Log to file
log_dest file /var/log/mosquitto/mosquitto.log

# Debug output
# debug_mode true

# ============================================================================
# Security
# ============================================================================
# Allow anonymous connections (development only - change for production)
allow_anonymous true

# User/password authentication (optional)
# password_file /etc/mosquitto/passwd

# TLS/SSL (production)
# listener 8883
# protocol mqtt
# cafile /path/to/ca.crt
# certfile /path/to/server.crt
# keyfile /path/to/server.key

# ============================================================================
# Performance Tuning
# ============================================================================
# Number of threads to handle client connections
# Default: number of CPUs
# thread_count 4

# Client ID length limit (default: 23)
# clientid_max_length 36

# Maximum message size (default: 20MB)
# message_size_limit 20971520

# Timeout for idle clients (seconds, default: 60)
# socket_default_keepalive_set true

# ============================================================================
# Advanced
# ============================================================================
# Allow empty usernames (when password_file is set)
allow_zero_length_clientid false

# Expire inflight messages
expire_inflight_after 3600

# Disconnect persistent clients at startup
# This helps with testing but not for production
# drop_privileges false

# ============================================================================
# Drone Telemetry Specific Settings
# ============================================================================

# Topics to protect (example)
# acl_file /etc/mosquitto/aclfile

# Keep-alive interval for clients (default: 60 seconds)
# Drone collector should publish every 100ms, so this is fine

# Message retry interval (milliseconds, default: 20000)
# Default is ok - we use QoS 1 which should handle retries

# Store outgoing messages (for QoS > 0)
# This is important for reliability with collector
max_inflight_messages 20

# Queue messages for offline subscribers
# Default 1000 is reasonable for telemetry
max_queued_messages 5000

# ============================================================================
# Notes for Drone System
# ============================================================================
# - C++ Collector publishes every 100ms to drone/telemetry
# - Dashboard subscribes with QoS 1
# - Each message is ~200 bytes
# - Expect ~10 Hz throughput
# - Recommended hardware: 1GB RAM, 1 CPU
# - For multi-drone: 2GB RAM, 2+ CPUs
